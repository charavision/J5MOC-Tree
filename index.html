<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J5MOC</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

html,body{
    width:100%;
    min-height:100%;
    background:rgb(176,176,176);
}

body{overflow-x:hidden}

.stage{
    position:relative;
    width:min(100vw,56.25vh);
    min-height:3600px;
    margin:0 auto;
    background-color:rgb(176,176,176);
    background-image:url("./background002.png");
    background-size:100% auto;
    background-repeat:no-repeat;
    background-position:top center;
}

.links{
    position:absolute;
    left:50%;
    top:350px;
    transform:translateX(-50%);
    width:82%;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.viewer-box{
    width:100%;
    aspect-ratio:1/1;
    border-radius:22px;
    overflow:hidden;
    background:rgba(40,40,40,.35);
    border:1px solid rgba(255,255,255,.20);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
}

.viewer-box iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}

.icon-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.icon-link{
    aspect-ratio:1/1;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(40,40,40,.35);
    border:1px solid rgba(255,255,255,.20);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
    transition:.25s;
}

.icon-link:hover,
.link:hover{
    transform:translateY(-3px);
    background:rgba(30,30,30,.55);
    border-color:rgba(255,255,255,.35);
}

.icon{
    width:62%;
    height:62%;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.icon svg{width:78%;height:78%}

.instagram{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.tiktok{background:#000}
.reddit{background:#ff4500}
.youtube{background:#fff}

.link{
    display:grid;
    grid-template-columns:72px 1fr 28px;
    align-items:center;
    min-height:112px;
    padding:16px 22px;
    text-decoration:none;
    color:white;
    border-radius:22px;
    background:rgba(40,40,40,.35);
    border:1px solid rgba(255,255,255,.20);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
    transition:.25s;
}

.thumb{
    width:64px;
    height:64px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:rgba(255,255,255,.88);
}

.thumb svg{width:44px;height:44px}

.label{
    text-align:center;
    font-size:28px;
    font-weight:800;
    color:white;
    text-shadow:0 2px 10px rgba(0,0,0,.28);
}

.menu{
    color:rgba(255,255,255,.68);
    font-size:30px;
    text-align:right;
}

@media(max-width:768px){
    .stage{width:100vw;min-height:3600px}
    .links{top:350px;width:88%;gap:16px}
    .icon-grid{gap:12px}
    .link{grid-template-columns:58px 1fr 22px;min-height:92px;padding:14px 18px}
    .thumb{width:52px;height:52px;border-radius:14px}
    .label{font-size:22px}
    .menu{font-size:24px}
}
</style>
</head>
