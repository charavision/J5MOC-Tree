<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J5MOC</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    background:rgb(176,176,176);
}

body{
    overflow-x:hidden;
}

/* 1080 x 1920 Layout */

.stage{
    position:relative;

    width:min(100vw,56.25vh);
    min-height:2600px;

    margin:0 auto;

    background-color:rgb(176,176,176);
    background-image:url("./background002.png");
    background-size:100% auto;
    background-repeat:no-repeat;
    background-position:top center;
}

/* LINKS */

.links{
    position:absolute;

    left:50%;
    top:350px;

    transform:translateX(-50%);

    width:82%;

    display:flex;
    flex-direction:column;
    gap:18px;
}

.link{
    display:block;

    text-decoration:none;

    color:white;
    font-weight:700;
    font-size:28px;

    text-align:center;

    padding:22px;

    border-radius:22px;

    background:rgba(40,40,40,.35);

    border:1px solid rgba(255,255,255,.20);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 12px 32px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.12);

    transition:.25s;
}

.link:hover{
    transform:translateY(-3px);
    background:rgba(30,30,30,.55);
    border-color:rgba(255,255,255,.35);
}

.link:active{
    transform:translateY(0);
}

/* MOBILE */

@media(max-width:768px){
    .stage{
        width:100vw;
        min-height:2600px;
    }

    .links{
        top:820px;
        width:84%;
        gap:16px;
    }

    .link{
        font-size:22px;
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="stage">

    <div class="links">

        <a class="link" href="https://reb.li/m/209065" target="_blank" rel="noopener">
           📖 Instructions
        </a>

        <a class="link" href="https://charavision.github.io/J5MOC-Viewer2/Viewer.html" target="_blank" rel="noopener">
           🤖 3D Viewer
        </a>

        <a class="link" href="https://www.youtube.com/@charavision" target="_blank" rel="noopener">
           ▶️ YouTube
        </a>

        <a class="link" href="https://github.com/charavision" target="_blank" rel="noopener">
           💻 GitHub
        </a>

        <a class="link" href="https://linktr.ee/j5moc" target="_blank" rel="noopener">
           🔗 Linktree
        </a>

    </div>

</div>

</body>
</html>
