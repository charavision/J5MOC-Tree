<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J5MOC Linktree</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #b8b8b8;
  color: white;
}

body {
  background-image: url("./background002.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.overlay {
  min-height: 100vh;
  padding: 42px 18px;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.08),
    rgba(0,0,0,0.18)
  );
  display: flex;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 440px;
  margin-top: 40px;
}

.logo-title {
  text-align: center;
  margin-bottom: 28px;
}

.logo-title h1 {
  margin: 0;
  font-size: 42px;
  letter-spacing: -1px;
  color: white;
  text-shadow: 0 4px 18px rgba(0,0,0,0.35);
}

.logo-title p {
  margin: 8px 0 0;
  font-size: 15px;
  color: rgba(255,255,255,0.86);
  text-shadow: 0 3px 12px rgba(0,0,0,0.35);
}

.links {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link {
  display: block;
  padding: 17px 20px;
  border-radius: 18px;
  text-decoration: none;
  color: white;
  font-weight: 700;
  font-size: 16px;
  text-align: center;

  background: rgba(0,0,0,0.36);
  border: 1px solid rgba(255,255,255,0.26);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    0 10px 28px rgba(0,0,0,0.20),
    inset 0 1px 0 rgba(255,255,255,0.18);

  transition: transform 0.18s ease, background 0.18s ease, border 0.18s ease;
}

.link:hover {
  transform: translateY(-2px);
  background: rgba(0,0,0,0.52);
  border-color: rgba(255,255,255,0.42);
}

.footer {
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.76);
  text-shadow: 0 2px 10px rgba(0,0,0,0.45);
}

@media (max-width: 600px) {
  body {
    background-size: cover;
    background-position: top center;
  }

  .overlay {
    padding-top: 26px;
  }

  .card {
    margin-top: 290px;
  }

  .logo-title h1 {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<div class="overlay">
  <main class="card">

    <section class="logo-title">
      <h1>J5MOC</h1>
      <p>LEGO Johnny 5 MOC by Charavision</p>
    </section>

    <section class="links">
      <a class="link" href="https://linktr.ee/j5moc" target="_blank" rel="noopener">Official Linktree</a>
      <a class="link" href="https://reb.li/m/209065" target="_blank" rel="noopener">Instructions / Rebrickable</a>
      <a class="link" href="https://charavision.github.io/J5MOC-Viewer2/Viewer.html" target="_blank" rel="noopener">3D Viewer</a>
      <a class="link" href="https://github.com/charavision" target="_blank" rel="noopener">GitHub</a>
      <a class="link" href="https://www.youtube.com/@charavision" target="_blank" rel="noopener">YouTube</a>
    </section>

    <div class="footer">
      © J5MOC · by Charavision
    </div>

  </main>
</div>

</body>
</html>
